# Picked up automatically by the repo-commons CodeQL scan, which fails on any
# non-suppressed alert. Neither the default nor the security-and-quality suite
# runs the alert-suppression query, so without it in-source
# `// codeql[<rule-id>]` comments are ignored. Rust has no upstream
# suppression query; ours lives in ./rust-alert-suppression.
packs:
  javascript:
    - codeql/javascript-queries:AlertSuppression.ql
queries:
  - uses: ./.github/codeql/rust-alert-suppression/AlertSuppression.ql
paths-ignore:
  - frontend/src/api/generated.ts
  - backend/target
  # Integration tests sign in with literal passwords for the seeded dev users.
  - backend/tests
