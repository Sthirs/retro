apiVersion: v1
kind: Service
metadata:
  name: {{ include "retro.fullname" . }}-backend
  labels:
    {{- include "retro.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "retro.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.backend.service.metricsPort }}
      targetPort: metrics
