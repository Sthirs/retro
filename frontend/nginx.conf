# Static SPA. /api is routed to the backend by the ingress, not by nginx.
map $request_uri $cache_control {
    default        "no-store";
    "~*^/assets/"  "public, max-age=31536000, immutable";
    "~*^/fonts/"   "public, max-age=31536000, immutable";
    "/favicon.svg" "public, max-age=86400";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # One server-level block of headers: a location-level add_header would
  # silently drop all of these.
  add_header Cache-Control $cache_control always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
