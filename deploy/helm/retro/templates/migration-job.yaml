{{- if eq .Values.backend.runMigrations "job" }}
# A regular Job (not a hook) so it can use the release's ConfigMap and
# Secrets. One Job per revision; new backend pods stay unready on /readyz
# until it has applied their migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "retro.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "retro.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "retro.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "retro.podSecurityContext" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "retro.image" (dict "root" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args: ["migrate"]
          {{- include "retro.containerSecurityContext" . | nindent 10 }}
          envFrom:
            - configMapRef:
                name: {{ include "retro.fullname" . }}-backend
          env:
            {{- include "retro.backendEnv" . | nindent 12 }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
