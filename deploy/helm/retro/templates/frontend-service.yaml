apiVersion: v1
kind: Service
metadata:
  name: {{ include "retro.fullname" . }}-frontend
  labels:
    {{- include "retro.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "retro.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
