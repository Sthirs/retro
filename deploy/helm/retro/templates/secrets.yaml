{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "retro.authSecretName" . }}
  labels:
    {{- include "retro.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "auth.jwtSecret (32+ chars) or auth.existingSecret is required" .Values.auth.jwtSecret | quote }}
  STATE_SECRET: {{ required "auth.stateSecret (32+ chars) or auth.existingSecret is required" .Values.auth.stateSecret | quote }}
  {{- if .Values.oidc.enabled }}
  OIDC_CLIENT_SECRET: {{ required "oidc.clientSecret or auth.existingSecret is required" .Values.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "retro.databaseSecretName" . }}
  labels:
    {{- include "retro.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "database.password or database.existingSecret is required" .Values.database.password | quote }}
{{- end }}
