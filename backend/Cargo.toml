[workspace]
members = [".", "migration"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[package]
name = "retro-backend"
# The released version is injected at build time through APP_VERSION
# (see docs/adr/0009-ci-release-and-versioning.md); this value never changes.
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "retro-backend"
path = "src/main.rs"

[dependencies]
migration = { path = "migration" }
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private", "cookie-key-expansion"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.10.3"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-time", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "set-header", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
